<!DOCTYPE html>
<html>
<head>
  <title>Color Extractor</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    #canvas { display: none; }
    #output { background: white; padding: 20px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; }
    .color-sample { display: inline-block; width: 40px; height: 40px; margin-left: 10px; border-radius: 4px; border: 1px solid #ccc; vertical-align: middle; }
  </style>
</head>
<body>
  <h1>Home.png Color Extractor</h1>
  <button onclick="analyzeImage()">Extract Colors</button>
  <div id="output"></div>
  <canvas id="canvas"></canvas>
  <img id="sourceImg" style="display:none" src="file:///c:/Users/THIS%20PC/talentloop-admin/src/services/design/Home.png" crossorigin="anonymous">
  
  <script>
    function analyzeImage() {
      const img = document.getElementById('sourceImg');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const output = document.getElementById('output');
      
      // Set canvas size to image size
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      
      // Draw image
      ctx.drawImage(img, 0, 0);
      
      let result = '=== COLOR ANALYSIS FROM HOME.PNG ===\n\n';
      result += `Image dimensions: ${canvas.width}x${canvas.height}\n\n`;
      
      // Helper function
      function getRegionColor(x, y, w, h, label) {
        const imageData = ctx.getImageData(x, y, w, h);
        const data = imageData.data;
        
        let r = 0, g = 0, b = 0, samples = 0;
        
        for (let i = 0; i < data.length; i += 40) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          samples++;
        }
        
        r = Math.round(r / samples);
        g = Math.round(g / samples);
        b = Math.round(b / samples);
        
        const hex = '#' + [r, g, b].map(n => n.toString(16).padStart(2, '0')).join('').toUpperCase();
        const line = `${label}: RGB(${r}, ${g}, ${b}) = ${hex}\n`;
        result += line;
        return hex;
      }
      
      result += 'SIDEBAR:\n';
      getRegionColor(20, 50, 150, 150, '  Background (top)');
      getRegionColor(20, 300, 150, 200, '  Background (middle)');
      getRegionColor(20, 1400, 150, 300, '  Background (bottom)');
      
      result += '\nMAIN PAGE BACKGROUND:\n';
      getRegionColor(300, 100, 600, 200, '  Main content area');
      
      result += '\nSTAT CARDS (top row):\n';
      getRegionColor(300, 300, 200, 200, '  Card background');
      getRegionColor(340, 320, 100, 80, '  Card value text');
      getRegionColor(340, 360, 100, 60, '  Card label text');
      
      result += '\nCHART CONTAINER:\n';
      getRegionColor(300, 1200, 800, 400, '  Chart background');
      
      result += '\nBORDERS:\n';
      getRegionColor(290, 295, 10, 300, '  Card border (left edge)');
      
      result += '\nTOP BAR:\n';
      getRegionColor(300, 50, 800, 80, '  Topbar background');
      
      result += '\nSEARCH INPUT:\n';
      getRegionColor(600, 200, 400, 80, '  Search input background');
      getRegionColor(650, 230, 300, 60, '  Search input text');
      
      output.textContent = result;
    }
    
    // Auto-analyze when image loads
    document.getElementById('sourceImg').onload = analyzeImage;
  </script>
</body>
</html>
